apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'androidx.navigation.safeargs.kotlin'
apply plugin: 'com.google.firebase.crashlytics'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    compileSdkVersion 29
    defaultConfig {
        applicationId "amrabed.android.release.evaluation"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 24
        versionName "3.3.0"
        multiDexEnabled true
        signingConfig signingConfigs.release
        resConfigs "en", "ar"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            signingConfig signingConfigs.release
        }
    }

    lintOptions {
        abortOnError false
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    kapt {
        arguments {
            arg('room.schemaLocation', "$projectDir/schemas")
            arg('room.incremental', 'true')
            arg('room.expandProjection', 'true')
        }
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
        implementation "androidx.navigation:navigation-fragment-ktx:$navigation_version"
        implementation "androidx.navigation:navigation-ui-ktx:$navigation_version"
        implementation 'androidx.core:core-ktx:1.19.1'
        implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.2.0'

        implementation 'androidx.appcompat:appcompat:1.8.0'
        implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
        implementation 'androidx.recyclerview:recyclerview:1.4.0'
        implementation 'androidx.preference:preference:1.2.1'
        implementation 'androidx.room:room-runtime:2.8.5'
        implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

        implementation 'com.google.android.material:material:1.14.0'

        implementation 'com.google.firebase:firebase-analytics-ktx:22.5.0'
        implementation 'com.google.firebase:firebase-auth-ktx:23.2.1'
        implementation 'com.google.firebase:firebase-inappmessaging-display-ktx:21.0.2'
        implementation 'com.google.firebase:firebase-crashlytics:21.1.0'
        implementation 'com.google.firebase:firebase-messaging:26.0.2'

        implementation 'com.firebaseui:firebase-ui-auth:10.0.0'

        implementation 'joda-time:joda-time:2.15.1'
        implementation 'com.github.PhilJay:MPAndroidChart:v3.0.1'
        implementation 'com.github.bumptech.glide:glide:5.0.9'

        kapt 'androidx.room:room-compiler:2.8.5'
        kapt 'org.xerial:sqlite-jdbc:3.54.1.0'
    }
}