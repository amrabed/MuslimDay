plugins {
    id "com.google.devtools.ksp"
    id "com.android.application"
    id "kotlin-android"
    id "kotlin-parcelize"
    id "kotlin-kapt"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    signingConfigs {
        release {
            storeFile = file(keystoreProperties["storeFile"])
            storePassword = keystoreProperties["storePassword"]
            keyAlias = keystoreProperties["keyAlias"]
            keyPassword = keystoreProperties["keyPassword"]
        }
    }

    compileSdk = 35
    defaultConfig {
        applicationId "amrabed.android.release.evaluation"
        minSdk = 23
        targetSdk = 35
        versionCode = 24
        versionName = "3.3.0"
        multiDexEnabled = true
        signingConfig = signingConfigs.release
        resourceConfigurations += ["en", "ar"]
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.txt"
            signingConfig = signingConfigs.release
        }
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
    }


    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    kapt {
        arguments {
            arg("room.schemaLocation", "$projectDir/schemas")
            arg("room.incremental", "true")
            arg("room.expandProjection", "true")
        }
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
        implementation "androidx.navigation:navigation-fragment-ktx:$navigation_version"
        implementation "androidx.navigation:navigation-ui-ktx:$navigation_version"
        implementation "androidx.core:core-ktx:1.15.0"
        implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7"

        implementation "androidx.appcompat:appcompat:1.7.0"
        implementation "androidx.vectordrawable:vectordrawable:1.2.0"
        implementation "androidx.recyclerview:recyclerview:1.4.0"
        implementation "androidx.preference:preference-ktx:1.2.1"
        implementation "androidx.room:room-runtime:2.6.1"
        implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"

        implementation "com.google.android.material:material:1.12.0"

        implementation "com.google.firebase:firebase-analytics-ktx:22.2.0"
        implementation "com.google.firebase:firebase-auth-ktx:23.1.0"
        implementation "com.google.firebase:firebase-inappmessaging-display-ktx:21.0.1"
        implementation "com.google.firebase:firebase-crashlytics:19.4.0"
        implementation "com.google.firebase:firebase-messaging:24.1.0"
        implementation "com.google.firebase:firebase-firestore-ktx:25.1.1"

        implementation "com.firebaseui:firebase-ui-auth:8.0.0"

        implementation "joda-time:joda-time:2.9.9"
        implementation "com.github.PhilJay:MPAndroidChart:v3.0.1"
        implementation "com.github.bumptech.glide:glide:4.11.0"

        ksp "androidx.room:room-compiler:$room_version"
        runtimeOnly "androidx.room:room-runtime:$room_version"
    }
    lint {
        abortOnError = false
    }
    namespace = "amrabed.android.release.evaluation"
}